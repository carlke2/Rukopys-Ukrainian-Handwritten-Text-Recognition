# ─────────────────────────────────────────────────────────────────
# configs/detector.yaml  —  Region Detector Configuration
# ─────────────────────────────────────────────────────────────────
#
# PURPOSE:
#   All settings related to the region detection model.
#   The detector's job is to FIND regions on the document and
#   predict their bounding boxes + region types.
#
# WHY YOLO:
#   YOLOv8/v11 (Ultralytics) is the most beginner-friendly
#   object-detection framework. It handles the full training loop,
#   data augmentation, and evaluation out of the box.
#   You supply images + label .txt files and it handles the rest.
#
# ── Model choice ─────────────────────────────────────────────────
#
# YOLO model size options:
#   yolo11n.pt  → nano     (~3 M params)   fastest, weakest
#   yolo11s.pt  → small    (~12 M params)  good baseline
#   yolo11m.pt  → medium   (~26 M params)  better accuracy
#   yolo11l.pt  → large    (~44 M params)  strong
#   yolo11x.pt  → xlarge   (~68 M params)  strongest, slowest
#
# Start with "s" or "m". "n" is too weak for complex documents.
model_name: "yolo11s.pt"

# ── Training hyperparameters ──────────────────────────────────────
epochs:          100          # number of full passes through training data
batch_size:      16           # images per GPU batch (reduce if OOM)
image_size:      1024         # input image size (px). Documents need 1024+
patience:        20           # stop if no improvement for this many epochs
lr0:             0.01         # initial learning rate
lrf:             0.01         # final LR = lr0 * lrf
momentum:        0.937
weight_decay:    0.0005
warmup_epochs:   3.0
workers:         4            # data loading threads (set 0 on Windows if errors)

# ── Augmentation ─────────────────────────────────────────────────
# Document images should NOT be flipped (text becomes mirrored).
augment:         true
fliplr:          0.0          # NO horizontal flip — breaks text direction
flipud:          0.0          # NO vertical flip
mosaic:          0.5          # mosaic augmentation probability
degrees:         5.0          # max rotation in degrees (documents can be tilted)
scale:           0.3          # zoom range
hsv_h:           0.015        # hue shift
hsv_s:           0.4          # saturation shift
hsv_v:           0.3          # value (brightness) shift

# ── Inference / NMS ──────────────────────────────────────────────
conf_threshold:  0.25         # minimum confidence to keep a detection
iou_threshold:   0.45         # NMS IOU threshold (overlapping boxes removed)
max_detections:  300          # max number of regions per page

# ── Checkpoint ───────────────────────────────────────────────────
save_dir:        "outputs/detector_runs"
save_period:     10           # save checkpoint every N epochs

# ── Device ───────────────────────────────────────────────────────
# "0"   → first GPU
# "cpu" → fallback
# "0,1" → multi-GPU (advanced)
device: "0"

# ── H100 constraint note ──────────────────────────────────────────
# The full inference pipeline must fit on a single H100 80 GB.
# YOLOv11s at image_size=1024 uses ~6 GB VRAM → safe.
# If you switch to YOLOv11x, peak VRAM can reach ~14 GB → still safe.

# ── Installation command (run only at training time) ─────────────
# pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
# pip install ultralytics

# ── Data path (generated by convert_to_yolo.py) ──────────────────
data_yaml: "data/yolo/data.yaml"
